<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>AhaMed 病例审核工具</title>
  <style>
    :root {
      --paper: #f4f0e8;
      --paper-deep: #e9e1d3;
      --sheet: #fffdf8;
      --ink: #172723;
      --muted: #68736e;
      --line: #d9d2c5;
      --green: #17684c;
      --green-soft: #e2efe8;
      --red: #a33c36;
      --red-soft: #f8e7e3;
      --amber: #9a6a1f;
      --amber-soft: #f7ecd5;
      --blue: #315f73;
      --shadow: 0 18px 50px rgba(35, 48, 42, 0.09);
      --radius: 18px;
      --sans: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 8%, rgba(23, 104, 76, 0.08), transparent 28rem),
        linear-gradient(115deg, rgba(255,255,255,0.22), transparent 40%),
        var(--paper);
      font-family: var(--sans);
      line-height: 1.65;
    }

    button, input, textarea { font: inherit; }

    button { color: inherit; }

    :focus-visible {
      outline: 3px solid rgba(49, 95, 115, 0.28);
      outline-offset: 2px;
    }

    .skip-link {
      position: fixed;
      left: 1rem;
      top: -5rem;
      z-index: 100;
      padding: .7rem 1rem;
      color: white;
      background: var(--ink);
      border-radius: 8px;
    }

    .skip-link:focus { top: 1rem; }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 268px minmax(0, 1fr) 342px;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      grid-column: 1 / -1;
      min-height: 76px;
      padding: 14px 22px;
      display: flex;
      align-items: center;
      gap: 22px;
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(244, 240, 232, 0.92);
      border-bottom: 1px solid rgba(23, 39, 35, 0.12);
      backdrop-filter: blur(14px);
    }

    .brand {
      min-width: 246px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border: 1px solid rgba(23, 104, 76, 0.28);
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--green);
      background: rgba(255,255,255,.56);
      font-family: var(--serif);
      font-weight: 700;
      letter-spacing: -.08em;
    }

    .brand strong {
      display: block;
      font-family: var(--serif);
      font-size: 18px;
      line-height: 1.1;
    }

    .brand small { color: var(--muted); }

    .progress-wrap {
      flex: 1;
      min-width: 160px;
      display: grid;
      gap: 5px;
    }

    .progress-copy {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .progress-track {
      height: 7px;
      overflow: hidden;
      background: rgba(23,39,35,.1);
      border-radius: 99px;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      background: var(--green);
      border-radius: inherit;
      transition: width .35s ease;
    }

    .top-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .save-state {
      min-width: 118px;
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    .button {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 13px;
      background: rgba(255,255,255,.62);
      cursor: pointer;
      transition: transform .15s ease, border-color .15s ease, background .15s ease;
    }

    .button:hover {
      transform: translateY(-1px);
      border-color: #ada596;
      background: white;
    }

    .button.primary {
      color: white;
      border-color: var(--ink);
      background: var(--ink);
      font-weight: 700;
    }

    .button.primary:hover { background: #263d37; }

    .sidebar,
    .review-rail {
      position: sticky;
      top: 76px;
      height: calc(100vh - 76px);
      overflow: auto;
    }

    .sidebar {
      padding: 26px 18px 30px 22px;
      border-right: 1px solid rgba(23,39,35,.12);
    }

    .side-heading {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .case-list {
      display: grid;
      gap: 8px;
    }

    .case-link {
      width: 100%;
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr) auto;
      align-items: center;
      gap: 9px;
      padding: 11px 10px;
      text-align: left;
      border: 1px solid transparent;
      border-radius: 12px;
      background: transparent;
      cursor: pointer;
    }

    .case-link:hover { background: rgba(255,255,255,.55); }

    .case-link.active {
      border-color: rgba(23,104,76,.22);
      background: rgba(255,255,255,.82);
      box-shadow: 0 9px 24px rgba(35,48,42,.06);
    }

    .case-number {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 50%;
      font-size: 12px;
      background: var(--sheet);
    }

    .case-link strong,
    .case-link small { display: block; }

    .case-link strong {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
    }

    .case-link small {
      overflow: hidden;
      color: var(--muted);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .case-state-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #aaa69d;
      box-shadow: 0 0 0 4px rgba(170,166,157,.12);
    }

    .case-state-dot.approved { background: var(--green); box-shadow: 0 0 0 4px rgba(23,104,76,.12); }
    .case-state-dot.rejected { background: var(--red); box-shadow: 0 0 0 4px rgba(163,60,54,.12); }

    .reviewer-card {
      margin-top: 28px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
    }

    .field { display: grid; gap: 6px; margin-bottom: 13px; }

    .field label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    input,
    textarea {
      width: 100%;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255,253,248,.92);
    }

    input { height: 42px; padding: 0 11px; }

    textarea {
      min-height: 106px;
      padding: 10px 11px;
      resize: vertical;
      line-height: 1.55;
    }

    input:focus,
    textarea:focus { border-color: var(--blue); outline: 3px solid rgba(49,95,115,.12); }

    .privacy-note {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.55;
    }

    .content {
      min-width: 0;
      padding: 38px clamp(22px, 4vw, 62px) 90px;
    }

    .case-header {
      max-width: 920px;
      margin: 0 auto 28px;
      animation: rise .35s ease both;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--green);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    h1, h2, h3 { font-family: var(--serif); }

    h1 {
      margin: 0;
      max-width: 820px;
      font-size: clamp(32px, 4vw, 55px);
      line-height: 1.12;
      letter-spacing: -.035em;
    }

    .case-subline {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .hero-sheet {
      max-width: 920px;
      margin: 0 auto 22px;
      padding: clamp(24px, 4vw, 44px);
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(23,39,35,.12);
      border-radius: var(--radius);
      background: var(--sheet);
      box-shadow: var(--shadow);
      animation: rise .4s .04s ease both;
    }

    .hero-sheet::after {
      content: "";
      width: 190px;
      height: 190px;
      position: absolute;
      right: -95px;
      top: -90px;
      border: 32px solid rgba(23,104,76,.055);
      border-radius: 50%;
    }

    .patient-line {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }

    .patient-line h2 { margin: 0; font-size: 29px; }

    .patient-meta { color: var(--muted); }

    .complaint-label {
      margin: 30px 0 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
    }

    .complaint {
      margin: 0;
      max-width: 780px;
      font-family: var(--serif);
      font-size: clamp(24px, 3vw, 36px);
      line-height: 1.45;
    }

    .content-block {
      max-width: 920px;
      margin: 22px auto;
      padding: clamp(22px, 3vw, 34px);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: rgba(255,253,248,.58);
      animation: rise .42s .08s ease both;
    }

    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 19px;
    }

    .section-head h2 { margin: 0; font-size: 25px; }
    .section-head p { margin: 0; color: var(--muted); font-size: 12px; text-align: right; }

    .fact-groups { display: grid; gap: 22px; }

    .fact-group h3 {
      margin: 0 0 10px;
      color: var(--muted);
      font-family: var(--sans);
      font-size: 12px;
      letter-spacing: .08em;
    }

    .fact-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px 16px;
    }

    .fact-row {
      min-width: 0;
      padding: 12px 0;
      display: grid;
      grid-template-columns: minmax(105px, .7fr) minmax(0, 1.7fr);
      gap: 13px;
      border-bottom: 1px dotted #d5cec1;
    }

    .fact-name { font-weight: 750; font-size: 13px; }
    .fact-value { min-width: 0; font-size: 14px; }

    .micro {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 500;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 8px;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 99px;
      background: rgba(255,255,255,.72);
      font-size: 11px;
      font-weight: 750;
      line-height: 1.2;
    }

    .pill.present, .pill.required { color: var(--green); border-color: rgba(23,104,76,.24); background: var(--green-soft); }
    .pill.absent, .pill.unnecessary { color: var(--red); border-color: rgba(163,60,54,.2); background: var(--red-soft); }
    .pill.unknown, .pill.useful { color: var(--amber); border-color: rgba(154,106,31,.22); background: var(--amber-soft); }

    .test-list,
    .diagnosis-grid { display: grid; gap: 10px; }

    .test-row {
      padding: 16px 0;
      display: grid;
      grid-template-columns: minmax(150px, .7fr) minmax(0, 1.6fr);
      gap: 18px;
      border-bottom: 1px solid var(--line);
    }

    .test-row:last-child { border-bottom: 0; }
    .test-row strong { font-size: 14px; }

    .diagnosis-callout {
      padding: 21px 24px;
      color: white;
      border-radius: 14px;
      background: var(--ink);
    }

    .diagnosis-callout small { color: rgba(255,255,255,.64); }
    .diagnosis-callout strong { display: block; margin-top: 4px; font-family: var(--serif); font-size: 28px; }

    .split-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .plain-panel {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: rgba(255,255,255,.62);
    }

    .plain-panel h3 { margin: 0 0 11px; font-size: 17px; }
    .plain-panel p { margin: 7px 0; }
    .plain-panel ul { margin: 8px 0 0; padding-left: 1.3rem; }

    .risk-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .risk-table th,
    .risk-table td { padding: 12px 9px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
    .risk-table th { color: var(--muted); font-size: 11px; letter-spacing: .05em; }

    details {
      max-width: 920px;
      margin: 22px auto;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: rgba(255,255,255,.5);
    }

    summary { padding: 15px 18px; cursor: pointer; font-weight: 750; }

    pre {
      max-height: 520px;
      margin: 0;
      padding: 18px;
      overflow: auto;
      color: #d7e8df;
      background: #14211e;
      border-radius: 0 0 12px 12px;
      font: 12px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .review-rail {
      padding: 26px 22px 30px 18px;
      border-left: 1px solid rgba(23,39,35,.12);
    }

    .review-card {
      padding: 21px;
      border: 1px solid rgba(23,39,35,.14);
      border-radius: var(--radius);
      background: var(--sheet);
      box-shadow: var(--shadow);
    }

    .review-card h2 { margin: 0; font-size: 23px; }
    .review-help { margin: 5px 0 18px; color: var(--muted); font-size: 12px; }

    .decision-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-bottom: 20px;
    }

    .decision {
      min-height: 74px;
      display: grid;
      place-items: center;
      gap: 1px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: white;
      cursor: pointer;
      font-weight: 800;
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
    }

    .decision:hover { transform: translateY(-2px); }
    .decision small { color: var(--muted); font-size: 10px; font-weight: 600; }
    .decision.approve:hover, .decision.approve.selected { color: var(--green); border-color: var(--green); background: var(--green-soft); }
    .decision.reject:hover, .decision.reject.selected { color: var(--red); border-color: var(--red); background: var(--red-soft); }

    .review-footer {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 8px;
      margin-top: 17px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .review-position { color: var(--muted); font-size: 12px; text-align: center; }

    .icon-button {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: white;
      cursor: pointer;
      font-size: 19px;
    }

    .icon-button:disabled { opacity: .38; cursor: default; }

    .scope-note {
      margin: 14px 1px 0;
      padding: 12px 14px;
      color: #5b554a;
      border-left: 3px solid #b38b45;
      background: rgba(247,236,213,.66);
      font-size: 11px;
      line-height: 1.55;
    }

    .toast {
      max-width: min(440px, calc(100vw - 30px));
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 80;
      padding: 11px 16px;
      color: white;
      border-radius: 99px;
      background: var(--ink);
      box-shadow: 0 16px 45px rgba(23,39,35,.24);
      opacity: 0;
      transform: translate(-50%, 18px);
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
      font-size: 13px;
      text-align: center;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    .modal {
      width: min(560px, calc(100vw - 28px));
      padding: 0;
      border: 0;
      border-radius: 18px;
      background: var(--sheet);
      box-shadow: 0 30px 90px rgba(23,39,35,.28);
    }

    .modal::backdrop { background: rgba(15,28,24,.48); backdrop-filter: blur(4px); }
    .modal-body { padding: 25px; }
    .modal h2 { margin: 0 0 8px; font-size: 24px; }
    .modal p { color: var(--muted); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

    .empty-state {
      max-width: 700px;
      margin: 90px auto;
      padding: 50px;
      text-align: center;
      border: 1px dashed #bdb3a3;
      border-radius: 18px;
      background: rgba(255,255,255,.44);
    }

    .empty-state h1 { margin: auto; font-size: 38px; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(9px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 1180px) {
      .app-shell { grid-template-columns: 224px minmax(0, 1fr); }
      .review-rail {
        grid-column: 2;
        position: relative;
        top: auto;
        height: auto;
        padding: 0 clamp(22px,4vw,62px) 70px;
        border-left: 0;
      }
      .review-card { max-width: 920px; margin: auto; }
      .content { padding-bottom: 30px; }
    }

    @media (max-width: 760px) {
      .app-shell { display: block; }
      .topbar { min-height: auto; padding: 12px 14px; flex-wrap: wrap; }
      .brand { min-width: 0; flex: 0 0 auto; }
      .brand strong { font-size: 16px; white-space: nowrap; }
      .brand small { display: none; }
      .progress-wrap { order: 3; width: 100%; }
      .top-actions .button:not(.primary), .save-state { display: none; }
      .top-actions { margin-left: auto; }
      .top-actions .button.primary { padding-inline: 12px; font-size: 0; }
      .top-actions .button.primary::after { content: "下载副本"; font-size: 14px; }
      .sidebar { position: static; height: auto; padding: 14px; border-right: 0; border-bottom: 1px solid var(--line); }
      .side-heading { display: none; }
      .case-list { display: flex; overflow-x: auto; padding-bottom: 3px; }
      .case-link { min-width: 188px; }
      .reviewer-card { margin-top: 14px; padding-top: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .reviewer-card .side-heading, .reviewer-card .privacy-note { grid-column: 1 / -1; display: block; }
      .field { margin: 0; }
      .content { padding: 28px 14px 26px; }
      .hero-sheet, .content-block { padding: 22px 18px; }
      .fact-list, .split-grid { grid-template-columns: 1fr; }
      .fact-row, .test-row { grid-template-columns: 1fr; gap: 5px; }
      .risk-table { display: block; overflow-x: auto; }
      .review-rail { padding: 0 14px 60px; }
      .review-card { padding: 18px; }
    }

    @media print {
      body { background: white; }
      .topbar, .sidebar, .review-footer, .top-actions, .toast { display: none !important; }
      .app-shell { display: block; }
      .content, .review-rail { padding: 0; }
      .review-rail { height: auto; overflow: visible; border: 0; }
      .hero-sheet, .content-block, .review-card { max-width: none; box-shadow: none; break-inside: avoid; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#case-content">跳到病例内容</a>

  <div class="app-shell">
    <header class="topbar">
      <div class="brand" aria-label="AhaMed 病例审核工具">
        <div class="brand-mark" aria-hidden="true">A+</div>
        <div><strong>病例审核工具</strong><small>看内容，做决定，留下意见</small></div>
      </div>

      <div class="progress-wrap" aria-label="审核进度">
        <div class="progress-copy"><span id="progressText">尚未开始</span><span id="progressPercent">0%</span></div>
        <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
      </div>

      <div class="top-actions">
        <span class="save-state" id="saveState" role="status" aria-live="polite">正在载入…</span>
        <button class="button" type="button" id="importCasesButton">导入病例</button>
        <button class="button" type="button" id="importReviewButton">导入意见</button>
        <button class="button" type="button" id="exportJsonButton">导出意见</button>
        <button class="button primary" type="button" id="exportHtmlButton">下载已审核副本</button>
      </div>
    </header>

    <aside class="sidebar" aria-label="病例列表与审核人信息">
      <h2 class="side-heading">病例列表</h2>
      <nav class="case-list" id="caseList"></nav>

      <section class="reviewer-card" aria-labelledby="reviewerHeading">
        <h2 class="side-heading" id="reviewerHeading">审核人</h2>
        <div class="field">
          <label for="reviewerName">姓名</label>
          <input id="reviewerName" autocomplete="name" placeholder="请输入姓名">
        </div>
        <div class="field">
          <label for="reviewerId">编号（可选）</label>
          <input id="reviewerId" autocomplete="off" placeholder="院内编号或审核编号">
        </div>
        <p class="privacy-note">请勿填写完整执业证号、证件号码或上传证照图片。</p>
      </section>
    </aside>

    <main class="content" id="case-content" tabindex="-1"></main>

    <aside class="review-rail" aria-label="当前病例审核意见">
      <section class="review-card">
        <h2>这一例是否接受？</h2>
        <p class="review-help">先看内容，再点击一个决定。问题与建议都可以留空。</p>

        const item = activeCase();
        if (!item) {
          elements.content.innerHTML = `<section class="empty-state"><p class="eyebrow">空白审核台</p><h1>请导入病例 JSON</h1><p>支持一次选择多个病例文件。导入后仍然可以下载为一个完整 HTML。</p><button class="button primary" type="button" id="emptyImportButton">导入病例</button></section>`;
          document.querySelector("#emptyImportButton")?.addEventListener("click", () => elements.caseFileInput.click());
          return;
        }

        const visible = item.playerVisible || {};
        const answer = item.answerKey || {};
        const rubric = item.rubric || {};
        const redFlags = item.redFlagExclusionMatrix?.entries || [];
        const requiredQuestions = (rubric.mustAskFactIds || []).map((id) => displayLabel(id));
        const differentials = (rubric.acceptableDifferentialConceptIds || []).map((id) => preferredConcept(item, id));
        const communication = (rubric.communicationCriterionIds || []).map((id) => displayLabel(id));

        elements.content.innerHTML = `
          <header class="case-header">
            <p class="eyebrow">病例 ${String(state.activeIndex + 1).padStart(2, "0")} / ${String(state.cases.length).padStart(2, "0")} · ${escapeHtml(item.packageStatus === "draft" ? "待审核草稿" : item.packageStatus || "病例")}</p>
            <h1>${escapeHtml(answer.targetDiagnosis || "未命名病例")}</h1>
            <p class="case-subline">${escapeHtml(item.publicCaseId || item.internalCaseId)} · 版本 ${escapeHtml(item.caseVersion)} · ${escapeHtml(item.locale || "zh-CN")}</p>
          </header>

          <section class="hero-sheet" aria-labelledby="overviewTitle">
            <div class="patient-line"><h2 id="overviewTitle">${escapeHtml(visible.patientDisplayName || "虚拟患者")}</h2><span class="patient-meta">${escapeHtml([visible.ageBand, visible.genderDisplay].filter(Boolean).join(" · "))}</span></div>
            <p class="complaint-label">初始主诉</p>
            <p class="complaint">“${escapeHtml(visible.chiefComplaint || "未填写主诉")}”</p>
          </section>

          <section class="content-block" aria-labelledby="factsTitle">
            <div class="section-head"><h2 id="factsTitle">患者病史与回答</h2><p>请重点看事实是否合理、前后一致、符合患者口吻</p></div>
            <div class="fact-groups">${factRows(item)}</div>
          </section>

          <section class="content-block" aria-labelledby="testsTitle">
            <div class="section-head"><h2 id="testsTitle">检查与结果</h2><p>“必须 / 可考虑 / 不建议”来自当前评分规则</p></div>
            <div class="test-list">${renderTests(item) || "<p>没有设定检查。</p>"}</div>
          </section>

          <section class="content-block" aria-labelledby="answerTitle">
            <div class="section-head"><h2 id="answerTitle">答案与评分重点</h2><p>这部分只供审核人员查看，不会展示给玩家</p></div>
            <div class="diagnosis-grid">
              <div class="diagnosis-callout"><small>标准诊断</small><strong>${escapeHtml(answer.targetDiagnosis || "未设置")}</strong><small>可接受同义词：${escapeHtml((answer.acceptedSynonyms || []).join("、") || "无")}</small></div>
              <div class="split-grid">
                <div class="plain-panel"><h3>必须问到</h3><ul>${requiredQuestions.map((value) => `<li>${escapeHtml(value)}</li>`).join("") || "<li>未设置</li>"}</ul></div>
                <div class="plain-panel"><h3>可接受的鉴别诊断</h3><ul>${differentials.map((value) => `<li>${escapeHtml(value)}</li>`).join("") || "<li>未设置</li>"}</ul><p class="micro">要求数量：${escapeHtml(rubric.requiredDifferentialCount ?? "未设置")}</p></div>
                <div class="plain-panel"><h3>沟通要求</h3><ul>${communication.map((value) => `<li>${escapeHtml(value)}</li>`).join("") || "<li>未设置</li>"}</ul></div>
                <div class="plain-panel"><h3>建议问诊长度</h3><p><strong>${escapeHtml(rubric.recommendedTurnLimit ?? "未设置")} 轮</strong></p><p class="micro">评分版本：${escapeHtml(item.evaluationVersion || "未设置")}</p></div>
              </div>
            </div>
          </section>

          <section class="content-block" aria-labelledby="riskTitle">
            <div class="section-head"><h2 id="riskTitle">危险征象排除</h2><p>请确认每项都能由病例内容支持</p></div>
            <table class="risk-table">
              <thead><tr><th>危险征象</th><th>要求</th><th>当前证据</th><th>依据</th></tr></thead>
              <tbody>${redFlags.map((entry) => `
                <tr>
                  <td><strong>${escapeHtml(entry.canonicalName)}</strong><span class="micro">${escapeHtml(entry.redFlagId)}</span></td>
                  <td><span class="pill ${entry.requiredState === "absent" ? "present" : "unknown"}">${entry.requiredState === "absent" ? "应已排除" : escapeHtml(entry.requiredState)}</span></td>
                  <td>${escapeHtml(Array.isArray(entry.evidenceFactIds) ? entry.evidenceFactIds.map(displayLabel).join("、") : "未设置")}<span class="micro">观测值：${escapeHtml(entry.observedValue ?? "未设置")} ${escapeHtml(entry.unit || "")}</span></td>
                  <td>${escapeHtml(entry.criterionSourceId || "未设置")}<span class="micro">${escapeHtml(entry.criterionSourceVersion || "")}</span></td>
                </tr>`).join("") || "<tr><td colspan=\"4\">没有危险征象矩阵。</td></tr>"}</tbody>
            </table>
          </section>

          <section class="content-block" aria-labelledby="sourceTitle">
            <div class="section-head"><h2 id="sourceTitle">来源与作者备注</h2><p>仅使用合成病例，不含真实患者资料</p></div>
            <div class="split-grid">
              <div class="plain-panel"><h3>病例来源</h3><p>${escapeHtml(item.provenance?.sourceCitation || "未填写")}</p><span class="micro">${escapeHtml(item.provenance?.license || "")}</span></div>
              <div class="plain-panel"><h3>作者备注</h3><p>${escapeHtml(item.review?.notes || "无")}</p><span class="micro">作者：${escapeHtml(item.review?.author || "未填写")}</span></div>
            </div>
          </section>

          <details>
            <summary>查看完整原始 JSON（技术核对用）</summary>
            <pre>${escapeHtml(JSON.stringify(item, null, 2))}</pre>
          </details>`;
      }

      function renderReviewPanel() {
        const item = activeCase();
        const disabled = !item;
        const review = item ? reviewFor(item) : { decision: null, issues: "", suggestions: "" };
        elements.approveButton.disabled = disabled;
        elements.rejectButton.disabled = disabled;
        elements.issuesInput.disabled = disabled;
        elements.suggestionsInput.disabled = disabled;
        elements.approveButton.classList.toggle("selected", review.decision === "approved");
        elements.rejectButton.classList.toggle("selected", review.decision === "rejected");
        elements.approveButton.setAttribute("aria-pressed", String(review.decision === "approved"));
        elements.rejectButton.setAttribute("aria-pressed", String(review.decision === "rejected"));
        elements.issuesInput.value = review.issues || "";
        elements.suggestionsInput.value = review.suggestions || "";
        elements.reviewPosition.textContent = item ? `第 ${state.activeIndex + 1} / ${state.cases.length} 例` : "没有病例";
        elements.previousButton.disabled = !item || state.activeIndex === 0;
        elements.nextButton.disabled = !item || state.activeIndex === state.cases.length - 1;
      }

      function renderAll({ scroll = false } = {}) {
        renderNavigation();
        renderProgress();
        renderCase();
        renderReviewPanel();
        if (scroll) window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function switchCase(index) {
        if (!Number.isInteger(index) || index < 0 || index >= state.cases.length || index === state.activeIndex) return;
        saveNow();
        state.activeIndex = index;
        scheduleSave();
        renderAll({ scroll: true });
      }

      function setDecision(decision) {
        const item = activeCase();
        if (!item) return;
        const review = reviewFor(item);
        review.decision = decision;
        review.reviewedAt = new Date().toISOString();
        review.updatedAt = review.reviewedAt;
        scheduleSave();
        renderNavigation();
        renderProgress();
        renderReviewPanel();
        showToast(decision === "approved" ? "已标记为“接受”" : "已标记为“不接受”");
      }

      function updateReviewText(field, value) {
        const item = activeCase();
        if (!item) return;
        const review = reviewFor(item);
        review[field] = value;
        review.updatedAt = new Date().toISOString();
        scheduleSave();
      }

      function reviewExport() {
        const rows = state.cases.map((item) => {
          const review = reviewFor(item);
          return {
            internalCaseId: item.internalCaseId || null,
            publicCaseId: item.publicCaseId || null,
            caseVersion: item.caseVersion || null,
            contentHash: item.provenance?.contentHash || null,
            targetDiagnosis: item.answerKey?.targetDiagnosis || null,
            decision: review.decision,
            issues: review.issues || "",
            suggestions: review.suggestions || "",
            reviewedAt: review.reviewedAt,
            updatedAt: review.updatedAt
          };
        });
        return {
          schemaVersion: REVIEW_EXPORT_SCHEMA,
          generatorVersion: GENERATOR_VERSION,
          exportType: "content-review-draft",
          formalReleaseApproval: false,
          exportedAt: new Date().toISOString(),
          reviewer: { name: state.reviewer.name || "", id: state.reviewer.id || "" },
          summary: {
            total: rows.length,
            approved: rows.filter((row) => row.decision === "approved").length,
            rejected: rows.filter((row) => row.decision === "rejected").length,
            pending: rows.filter((row) => !row.decision).length
          },
          reviews: rows
        };
      }

      function dateStamp() {
        const date = new Date();
        const pad = (value) => String(value).padStart(2, "0");
        return `${date.getFullYear()}${pad(date.getMonth() + 1)}${pad(date.getDate())}`;
      }

      function safeFilePart(value) {
        return String(value || "审核人未填写").trim().replace(/[\\/:*?"<>|\s]+/gu, "-").slice(0, 40) || "审核人未填写";
      }

      function downloadBlob(content, type, filename) {
        const url = URL.createObjectURL(new Blob([content], { type }));
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1200);
      }

      function exportJson() {
        saveNow();
        downloadBlob(JSON.stringify(reviewExport(), null, 2), "application/json;charset=utf-8", `AhaMed-病例审核意见-${safeFilePart(state.reviewer.name)}-${dateStamp()}.json`);
        showToast("审核意见 JSON 已下载");
      }

      function exportHtml() {
        saveNow();
        const clone = document.documentElement.cloneNode(true);
        const stateScript = clone.querySelector("#embedded-review-state");
        const embeddedJson = JSON.stringify(snapshot()).replaceAll("<", "\\u003c");
        stateScript.textContent = embeddedJson;
        const title = clone.querySelector("title");
        title.textContent = `AhaMed 病例审核 · ${state.reviewer.name || "未署名"}`;
        downloadBlob(`<!doctype html>\n${clone.outerHTML}`, "text/html;charset=utf-8", `AhaMed-已审核副本-${safeFilePart(state.reviewer.name)}-${dateStamp()}.html`);
        if (typeof elements.exportDialog.showModal === "function") elements.exportDialog.showModal();
        else showToast("已审核 HTML 副本已下载");
      }

      async function importCases(files) {
        const imported = [];
        const errors = [];
        for (const file of files) {
          try {
            const value = JSON.parse(await file.text());
            const values = Array.isArray(value) ? value : [value];
            for (const item of values) {
              if (!item || typeof item !== "object" || !(item.internalCaseId || item.publicCaseId) || !item.caseVersion) {
                throw new Error("缺少病例 ID 或版本");
              }
              imported.push(item);
            }
          } catch (error) {
            errors.push(`${file.name}：${error.message || "无法解析"}`);
          }
        }
        if (!imported.length) {
          showToast(errors[0] || "没有可导入的病例");
          return;
        }
        const merged = new Map(state.cases.map((item) => [caseKey(item), item]));
        imported.forEach((item) => merged.set(caseKey(item), item));
        state.cases = [...merged.values()];
        state.activeIndex = Math.max(0, state.cases.length - imported.length);
        saveNow();
        renderAll({ scroll: true });
        showToast(`已导入 ${imported.length} 例${errors.length ? `，${errors.length} 个文件失败` : ""}`);
      }

      async function importReview(file) {
        try {
          const value = JSON.parse(await file.text());
          if (value.schemaVersion !== REVIEW_EXPORT_SCHEMA || !Array.isArray(value.reviews)) throw new Error("不是本工具导出的审核意见文件");
          const index = new Map(state.cases.map((item) => {
            const looseKey = [item.internalCaseId || item.publicCaseId, item.caseVersion, item.provenance?.contentHash || ""].join("::");
            return [looseKey, item];
          }));
          let matched = 0;
          for (const row of value.reviews) {
            const looseKey = [row.internalCaseId || row.publicCaseId, row.caseVersion, row.contentHash || ""].join("::");
            const item = index.get(looseKey);
            if (!item) continue;
            state.reviews[caseKey(item)] = {
              decision: ["approved", "rejected"].includes(row.decision) ? row.decision : null,
              issues: String(row.issues || ""),
              suggestions: String(row.suggestions || ""),
              reviewedAt: row.reviewedAt || null,
              updatedAt: row.updatedAt || new Date().toISOString()
            };
            matched += 1;
          }
          if (value.reviewer) state.reviewer = { name: String(value.reviewer.name || ""), id: String(value.reviewer.id || "") };
          elements.reviewerName.value = state.reviewer.name;
          elements.reviewerId.value = state.reviewer.id;
          saveNow();
          renderAll();
          showToast(`已合并 ${matched} 例审核意见`);
        } catch (error) {
          showToast(error.message || "审核意见导入失败");
        }
      }

      elements.approveButton.addEventListener("click", () => setDecision("approved"));
      elements.rejectButton.addEventListener("click", () => setDecision("rejected"));
      elements.issuesInput.addEventListener("input", (event) => updateReviewText("issues", event.target.value));
      elements.suggestionsInput.addEventListener("input", (event) => updateReviewText("suggestions", event.target.value));
      elements.previousButton.addEventListener("click", () => switchCase(state.activeIndex - 1));
      elements.nextButton.addEventListener("click", () => switchCase(state.activeIndex + 1));

      elements.reviewerName.addEventListener("input", (event) => {
        state.reviewer.name = event.target.value;
        scheduleSave();
      });
      elements.reviewerId.addEventListener("input", (event) => {
        state.reviewer.id = event.target.value;
        scheduleSave();
      });

      document.querySelector("#importCasesButton").addEventListener("click", () => elements.caseFileInput.click());
      document.querySelector("#importReviewButton").addEventListener("click", () => elements.reviewFileInput.click());
      document.querySelector("#exportJsonButton").addEventListener("click", exportJson);
      document.querySelector("#exportHtmlButton").addEventListener("click", exportHtml);
      document.querySelector("#closeDialogButton").addEventListener("click", () => elements.exportDialog.close());
      elements.caseFileInput.addEventListener("change", async (event) => {
        await importCases([...event.target.files]);
        event.target.value = "";
      });
      elements.reviewFileInput.addEventListener("change", async (event) => {
        if (event.target.files[0]) await importReview(event.target.files[0]);
        event.target.value = "";
      });
      window.addEventListener("beforeunload", saveNow);

      elements.reviewerName.value = state.reviewer.name || "";
      elements.reviewerId.value = state.reviewer.id || "";
      elements.saveState.textContent = state.updatedAt ? `已恢复 ${new Date(state.updatedAt).toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" })}` : "尚无修改";
      renderAll();
    })();
  </script>
</body>
</html>
